<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Highway Havoc '94</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0;background:#07050f}body{display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,177.7vh);max-width:100%;image-rendering:pixelated;background:#000}</style></head><body><canvas id="c" width="640" height="360"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=640,H=360,SL=200,RW=2000,DR=150,D=.84,CH=900,PZ=CH*D,N=5000,MV=9200;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),K={};
const segs=[];
for(let i=0;i<N+DR+5;i++){const o=[];if(i%4==0&&i>20)for(const s of[-1,1])if(Math.random()<.8)o.push({x:s*R(1.35,2.6),t:(Math.random()*4)|0,h:R(.8,1.2),hit:0});
segs.push({i,z:i*SL,y:Math.sin(i/90)*1300+Math.sin(i/33)*350,c:(Math.sin(i/61)*3.4+Math.sin(i/21)*1.2)*Math.min(1,i/80),o})}
let st='title',pos,v,px,hp,t,heat,meter,cnt,shake=0,lean,pcd,pt,pd,cop,rv,cars,camX,camY,sky=0,clock=0,res='',A,eng,ag;
function reset(){pos=PZ+100;v=0;px=0;hp=100;t=0;heat=0;meter=0;cnt=3;shake=0;lean=0;pcd=0;pt=0;pd=1;cop=null;
segs.forEach(s=>s.o.forEach(o=>o.hit=0));
rv=['#e33','#3b5','#39f','#fc2','#c3f','#f80','#0cc','#eee','#999'].map((col,i)=>({z:pos+350+i*300,x:(i%3-1)*.55,v:0,b:R(6800,8500),hp:60,down:0,cd:R(0,1),tx:0,tt:0,col,pt:0,pd:1,ag:Math.random()<.6,hurt:0,lean:0}));
cars=[];for(let i=0;i<24;i++)cars.push({car:1,z:R(4000,N*SL-3000),x:[-.66,0,.66][i%3],v:R(2600,4200),col:['#c22','#28c','#ddd','#2a5','#dd3'][i%5],cd:0})}
reset();
function snd(){if(A)return;A=new AudioContext();eng=A.createOscillator();eng.type='sawtooth';ag=A.createGain();ag.gain.value=0;eng.connect(ag);ag.connect(A.destination);eng.start()}
function tone(f,d,ty='square',vol=.12){if(!A)return;const o=A.createOscillator(),q=A.createGain();o.type=ty;o.frequency.value=f;q.gain.setValueAtTime(vol,A.currentTime);q.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(q);q.connect(A.destination);o.start();o.stop(A.currentTime+d)}
const rank=()=>rv.filter(r=>r.z>pos).length+1;
function hurt(d){hp-=d;shake=.25;tone(90,.2,'sawtooth',.25)}
function end(m){st='over';res=m;shake=0}
function punch(dir){if(st!='play'||cnt>0||pcd>0)return;pcd=.38;pt=.22;pd=dir;tone(220,.08);
for(const r of rv.concat(cop||[])){const dz=r.z-pos,dx=r.x-px;if(!r.down&&dz>-300&&dz<450&&dx*dir>0&&Math.abs(dx)<.65){r.hp-=26;r.hurt=.2;r.x+=dir*.2;r.v*=.85;heat++;tone(70,.15,'sawtooth',.3);if(r.hp<=0){r.down=r.cop?6:3.5;if(r.cop)heat=0}}}}
function ai(r,dt){const d=r.z-pos;r.cd-=dt;r.pt-=dt;r.hurt-=dt;
if(r.down>0){r.down-=dt;r.v=Math.max(0,r.v-7000*dt);if(r.down<=0)r.hp=r.cop?90:50}
else{let tv=r.b;if(r.cop)tv=cl(v+(380-d)*1.3,3000,9800);else{if(d>9000)tv*=.9;if(d<-3000)tv*=1.12}
r.v+=(tv-r.v)*dt*1.6;r.tt-=dt;if(r.tt<=0){r.tt=R(1.2,3);r.tx=R(-.8,.8)}
if(r.cop||(r.ag&&Math.abs(d)<1000))r.tx=px+(r.x>px?.3:-.3)*(r.cop?.3:1);
for(const q of cars){const dz=q.z-r.z;if(dz>0&&dz<1400&&Math.abs(q.x-r.x)<.4){r.tx=q.x>0?q.x-.6:q.x+.6;if(dz<260&&Math.abs(q.x-r.x)<.3){r.down=2.2;r.v*=.2}}}
r.lean=cl((r.tx-r.x)*3,-1,1);r.x+=cl(cl(r.tx,-.9,.9)-r.x,-dt*.7,dt*.7);
if(Math.abs(d)<350&&Math.abs(r.x-px)<.5&&r.cd<=0){r.cd=R(1,2);r.pt=.25;r.pd=r.x<px?1:-1;hurt(r.cop?3:6)}}
r.z+=r.v*dt}
function upd(dt){
if(st=='title'){pos+=3500*dt;v=3500;if(pos>(N-400)*SL)pos=PZ+100;return}
if(st!='play')return;
if(cnt>0){cnt-=dt;return}
const sp=v/MV,sg=segs[Math.floor(pos/SL)];t+=dt;
const up=K.ArrowUp||K.KeyW,dn=K.ArrowDown||K.KeyS,ste=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0);
v+=(up?(1-sp)*4200:-1400)*dt-(dn?6500*dt:0);
if(Math.abs(px)>1.08)v-=Math.max(0,v-3200)*2.2*dt;
v=cl(v,0,MV);px=cl(px+ste*dt*2.1*(.2+sp)-dt*.6*sp*sp*sg.c,-2.4,2.4);
lean+=(ste-lean)*dt*8;sky+=sg.c*sp*dt*30;pos+=v*dt;
for(const o of sg.o)if(!o.hit&&Math.abs(o.x-px)<.2){o.hit=1;hurt(12);v*=.2}
for(const q of cars){q.z+=q.v*dt;q.cd=Math.max(0,q.cd-dt);const dz=q.z-pos;
if(!q.cd&&dz>-220&&dz<220&&Math.abs(q.x-px)<.3){q.cd=1.2;hurt(10);v=Math.min(v,q.v)*.5;px+=px>q.x?.25:-.25}}
if(!cop&&heat>=2){cop={cop:1,z:pos-1600,x:0,v:v,hp:90,down:0,cd:1,tx:0,tt:1,col:'#fff',pt:0,pd:1,ag:1,hurt:0,b:0,lean:0};tone(600,.3,'square',.2)}
for(const r of rv.concat(cop||[]))ai(r,dt);
if(cop&&!cop.down&&Math.abs(cop.z-pos)<800&&Math.abs(cop.x-px)<.45)meter+=30*dt;else meter=Math.max(0,meter-25*dt);
if(meter>=100)end('BUSTED!');else if(hp<=0)end('WIPED OUT!');else if(pos>=N*SL)end('FINISH');
}
function pr(z,y,cx){const s=D/z;return{x:W/2+s*cx*W/2,y:H/2-s*(y-camY)*H/2,w:s*RW*W/2,k:s*W/2,z}}
function poly(a,b,wa,wb,col){g.fillStyle=col;g.beginPath();g.moveTo(a.x-wa,a.y);g.lineTo(b.x-wb,b.y);g.lineTo(b.x+wb,b.y);g.lineTo(a.x+wa,a.y);g.fill()}
function scn(o,A){const k=A.k*o.h,x=A.x+A.k*o.x*RW,y=A.y,r=(a,b,w,h,col)=>{g.fillStyle=col;g.fillRect(x+a*k,y-b*k,w*k,h*k)};
if(o.t<2){r(-40,420,80,420,'#5a3a1a');g.fillStyle=o.t?'#2b8a3e':'#17683a';g.beginPath();if(o.t)g.arc(x,y-620*k,330*k,0,7);else{g.moveTo(x-320*k,y-300*k);g.lineTo(x,y-1100*k);g.lineTo(x+320*k,y-300*k)}g.fill()}
else if(o.t==2){r(-380,500,60,500,'#444');r(320,500,60,500,'#444');r(-450,1320,900,420,'#e42c78');r(-400,1280,800,340,'#ffd23f')}
else{r(-25,1000,50,1000,'#999');r(-25,1050,300,50,'#999');r(200,1000,100,60,'#ffe9a0')}}
function car(x,y,s,col){g.save();g.translate(x,y);g.scale(s*.9,s*.9);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-60,-6,120,12);
g.fillStyle='#111';g.fillRect(-55,-22,22,22);g.fillRect(33,-22,22,22);g.fillStyle=col;g.fillRect(-62,-72,124,54);g.fillRect(-46,-104,92,36);
g.fillStyle='#9cf';g.fillRect(-38,-98,76,24);g.fillStyle='#f22';g.fillRect(-58,-60,22,10);g.fillRect(36,-60,22,10);g.restore()}
function bike(x,y,s,e){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,0,45,9,0,0,7);g.fill();
if(e.down>0){g.rotate(1.3);g.translate(-25,-5)}else g.transform(1,0,(e.lean||0)*.25,1,0,0);
const cp=e.cop,jc=cp?'#2050d0':e.col,f=(col,a,b,w,h)=>{g.fillStyle=col;g.fillRect(a,b,w,h)};
f('#111',-8,-48,16,48);f('#333',-17,-78,34,34);f(cp?'#eee':e.col,-20,-84,40,12);f('#f22',-10,-70,8,5);f('#f22',2,-70,8,5);
f(jc,-22,-128,44,50);f('#000',-20,-120,40,4);
g.fillStyle=cp?'#eee':'#222';g.beginPath();g.arc(0,-140,15,0,7);g.fill();f('#111',-9,-146,18,8);
if(cp)f((clock*8|0)%2?'#f22':'#25f',-14,-162,28,8);
g.strokeStyle=jc;g.lineWidth=11;g.lineCap='round';
for(const sd of[-1,1]){const p=e.pt>0&&e.pd==sd;g.beginPath();g.moveTo(sd*22,-118);g.lineTo(sd*(p?72:34),p?-108:-84);g.stroke();if(p){g.fillStyle='#fcb';g.beginPath();g.arc(sd*76,-108,8,0,7);g.fill()}}
if(e.hurt>0)f('rgba(255,255,255,.6)',-22,-128,44,50);
g.restore()}
function draw(){
const camZ=pos-PZ,bi=Math.floor(camZ/SL),bs=segs[bi],bp=(camZ%SL)/SL;
camY=bs.y+(segs[bi+1].y-bs.y)*bp+CH;camX=px*RW;
g.save();if(shake>0)g.translate(R(-3,3),R(-3,3));
const gr=g.createLinearGradient(0,0,0,H/2+20);gr.addColorStop(0,'#1b0f4d');gr.addColorStop(.6,'#e8503a');gr.addColorStop(1,'#ffc76a');g.fillStyle=gr;g.fillRect(0,0,W,H);
g.fillStyle='#ffe08a';g.beginPath();g.arc(W*.7,H/2-45,38,0,7);g.fill();
g.fillStyle='#3a1a5c';g.beginPath();g.moveTo(0,H/2+10);for(let x=0;x<=W;x+=8)g.lineTo(x,H/2-Math.abs(Math.sin((x+sky)/70))*38-Math.sin((x+sky)/23)*8-6);g.lineTo(W,H/2+10);g.fill();
g.fillStyle='#1d6a29';g.fillRect(0,H/2,W,H/2);
let x=0,dx=-bs.c*bp,my=H;
for(let n=0;n<DR;n++){const s=segs[bi+n],u=segs[bi+n+1],a=pr(s.z-camZ,s.y,x-camX),b=pr(u.z-camZ,u.y,x+dx-camX);x+=dx;dx+=s.c;s.A=a;s.vis=false;
if(a.z<=D||b.y>=a.y||b.y>=my)continue;
s.vis=true;my=a.y;s.B=b;const e=(s.i>>2)&1;
g.fillStyle=e?'#22752e':'#1d6a29';g.fillRect(0,b.y,W,a.y-b.y+1);
poly(a,b,a.w*1.14,b.w*1.14,e?'#d22':'#eee');
poly(a,b,a.w,b.w,s.i>=N-4&&s.i<N?(e?'#fff':'#111'):(e?'#6a6a70':'#616167'));
if(e)for(const q of[-.33,.33])poly({x:a.x+a.w*q,y:a.y},{x:b.x+b.w*q,y:b.y},a.w*.012,b.w*.012,'#ddd')}
const ents=cars.concat(rv,cop||[]);
for(let n=DR-1;n>=0;n--){const s=segs[bi+n];if(!s.vis)continue;const a=s.A,b=s.B;
for(const o of s.o)scn(o,a);
for(const e of ents){if(Math.floor(e.z/SL)!=bi+n)continue;const p=(e.z-s.z)/SL,X=a.x+(b.x-a.x)*p,Y=a.y+(b.y-a.y)*p,k=a.k+(b.k-a.k)*p,sx=X+k*e.x*RW;
if(e.car)car(sx,Y,k*2.5,e.col);else bike(sx,Y,k*2.5,e)}}
bike(W/2,H-8+Math.sin(clock*30)*(v/MV)*1.5,.95,{col:'#ff8a00',lean,pt,pd,hurt:0,down:0});
g.restore()}
function T(s,x,y,col='#fff',al='left',sz=8){g.font=sz+'px "Press Start 2P",monospace';g.textAlign=al;g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y)}
function hud(){
if(st=='title'||st=='over'){g.fillStyle='rgba(8,4,24,.62)';g.fillRect(0,0,W,H)}
if(st=='title'){T('HIGHWAY HAVOC',W/2,110,'#ffc21a','center',28);T("'94  STREET RACE & FIGHT",W/2,138,'#ff6a3d','center',9);
['ARROWS / WASD  = ACCELERATE, BRAKE, STEER','Z / Q  = PUNCH LEFT      X / E  = PUNCH RIGHT','KNOCK RIVALS DOWN. HIT TWICE AND THE COPS COME.','FINISH TOP 3. DONT GET BUSTED.'].forEach((l,i)=>T(l,W/2,186+i*18,'#fff','center',7));
if((clock*2|0)%2)T('PRESS ENTER',W/2,300,'#fff','center',12);return}
if(st=='over'){T(res,W/2,120,res=='FINISH'?'#5f5':'#f44','center',26);
if(res=='FINISH'){const r=rank();T('RANK '+r+' / '+(rv.length+1),W/2,170,'#ffc21a','center',14);T(r<=3?'PODIUM! LEGEND!':'TRY FOR TOP 3',W/2,196,'#fff','center',9)}
T('TIME '+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'),W/2,225,'#fff','center',9);
if((clock*2|0)%2)T('ENTER = RACE AGAIN',W/2,290,'#fff','center',11);return}
T('POS '+rank()+'/'+(rv.length+1),8,16,'#ffc21a');
T(Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'),W/2,16,'#fff','center');
T(Math.round(v/MV*180)+' KM/H',W-8,16,'#fff','right');
g.fillStyle='#000';g.fillRect(8,H-20,104,10);g.fillStyle=hp>35?'#3d3':'#e33';g.fillRect(10,H-18,Math.max(0,hp)/100*100,6);T('HEALTH',8,H-24);
g.fillStyle='#000';g.fillRect(8,24,W-16,4);g.fillStyle='#ffc21a';g.fillRect(8,24,cl(pos/(N*SL),0,1)*(W-16),4);
if(cop&&!cop.down){T('COPS!',W-8,H-14,(clock*6|0)%2?'#f44':'#48f','right',10)}
if(meter>0){g.fillStyle='#000';g.fillRect(W/2-52,H-26,104,10);g.fillStyle='#48f';g.fillRect(W/2-50,H-24,meter,6);T('BUSTED?',W/2,H-30,'#fff','center')}
if(cnt>0)T(String(Math.ceil(cnt)),W/2,H/2,'#ffc21a','center',48)}
onkeydown=e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();snd();
if(e.code=='Enter'&&st!='play'){reset();st='play'}
if(!e.repeat){if(e.code=='KeyZ'||e.code=='KeyQ')punch(-1);if(e.code=='KeyX'||e.code=='KeyE')punch(1)}};
onkeyup=e=>K[e.code]=0;onblur=()=>{for(const k in K)K[k]=0};
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;
if(pcd>0)pcd-=dt;if(pt>0)pt-=dt;if(shake>0)shake-=dt;
upd(dt);draw();hud();
if(eng){ag.gain.value=st=='play'&&cnt<=0?.035:0;eng.frequency.value=40+v/45}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
